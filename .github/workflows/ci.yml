name: Native tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            sanitizers: 'OFF'
          - name: asan-ubsan
            build_type: Debug
            sanitizers: 'ON'
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build/ci-${{ matrix.name }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake make g++-13 libcurl4-openssl-dev libssl-dev openssl python3
      - name: Record environment
        run: |
          mkdir -p "$BUILD_DIR"
          {
            uname -a
            /usr/bin/cmake --version
            /usr/bin/g++-13 --version
            /usr/bin/python3 --version
            dpkg-query -W cmake make g++-13 libcurl4-openssl-dev libssl-dev openssl python3
          } > "$BUILD_DIR/environment.txt"
      - name: Configure
        run: |
          /usr/bin/cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++-13 \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DSPE_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            2>&1 | tee "$BUILD_DIR/configure.log"
      - name: Build
        run: /usr/bin/cmake --build "$BUILD_DIR" --parallel 2 2>&1 | tee "$BUILD_DIR/build.log"
      - name: Run unit and real HTTP integration tests
        run: /usr/bin/ctest --test-dir "$BUILD_DIR" --output-on-failure 2>&1 | tee "$BUILD_DIR/ctest.log"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.name }}-test-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.BUILD_DIR }}/environment.txt
            ${{ env.BUILD_DIR }}/configure.log
            ${{ env.BUILD_DIR }}/build.log
            ${{ env.BUILD_DIR }}/ctest.log
            ${{ env.BUILD_DIR }}/test-results/managed/*/summary.json
